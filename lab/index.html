<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visual Lab · Class 10 Python</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=JetBrains+Mono:wght@400;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: a lab bench. Pickers on top, the live visual is the big surface, code + output sit beside it like a notebook. */
:root{
  --paper:#F4F4EF; --panel:#FFFFFF; --sunk:#ECEBE4; --ink:#16213A; --muted:#55607A; --line:#D9D7CD;
  --blue:#2457D6; --blue-soft:#E2EAFF; --orange:#B0520A; --orange-soft:#FFE7CF;
  --green:#11704A; --green-soft:#D9F2E4; --red:#A32121; --red-soft:#FCE1E1; --violet:#5B3FA0; --violet-soft:#ECE4FF;
  --code-bg:#16213A; --code-fg:#E6ECF8; --code-kw:#FFB86B; --code-str:#8EE6A0; --code-num:#8CC4FF; --code-com:#93A3C0; --code-fn:#F3D37A; --code-line:#26345A;
  --display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito Sans','Segoe UI',system-ui,Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,'Courier New',monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1527; --panel:#172036; --sunk:#121A2E; --ink:#E7ECF7; --muted:#A3AFCA; --line:#2A3655;
  --blue:#86A8FF; --blue-soft:#1E2C58; --orange:#FFAE6B; --orange-soft:#45291A;
  --green:#6ED6A0; --green-soft:#133627; --red:#FF8B8B; --red-soft:#46202A; --violet:#BBA4FF; --violet-soft:#2C2455;
  --code-bg:#0A1020; --code-line:#1C2850; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1527; --panel:#172036; --sunk:#121A2E; --ink:#E7ECF7; --muted:#A3AFCA; --line:#2A3655;
  --blue:#86A8FF; --blue-soft:#1E2C58; --orange:#FFAE6B; --orange-soft:#45291A;
  --green:#6ED6A0; --green-soft:#133627; --red:#FF8B8B; --red-soft:#46202A; --violet:#BBA4FF; --violet-soft:#2C2455;
  --code-bg:#0A1020; --code-line:#1C2850; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:20px 56px;display:flex;flex-direction:column;gap:22px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--line)}
.brand{display:flex;gap:14px;align-items:center;min-width:0}
.prompt{font:700 1.05rem var(--mono);color:var(--panel);background:var(--blue);padding:.45rem .6rem;border-radius:10px;letter-spacing:.02em}
.brand h1{font:600 clamp(1.5rem,3vw,2rem)/1.1 var(--display);margin:0;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.95rem}
.pickers{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.pick{display:flex;flex-direction:column;gap:5px;font:700 .72rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:0}
.pick select{font:600 1rem var(--body);text-transform:none;letter-spacing:0;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:.5rem .7rem;min-width:0;max-width:100%;cursor:pointer}
.pick select:hover{border-color:var(--blue)}
#modSel{width:15.5rem}#topSel{width:20rem}
.nav{display:flex;align-items:center;gap:8px}
.nav button{width:42px;height:42px;border-radius:10px;border:2px solid var(--line);background:var(--panel);font:700 1.1rem var(--mono);cursor:pointer}
.nav button:hover{border-color:var(--blue);color:var(--blue)}
#pos{font:600 .9rem var(--mono);color:var(--muted);min-width:4.5em;text-align:center;font-variant-numeric:tabular-nums}

/* topic intro */
.intro{display:flex;flex-direction:column;gap:6px;max-width:72ch}
.eyebrow{font:700 .78rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--orange);margin:0}
.intro h2{font:600 clamp(1.6rem,3.4vw,2.3rem)/1.12 var(--display);margin:0;text-wrap:balance}
.intro p#blurb{margin:0;color:var(--muted);font-size:1.05rem}

/* work area */
.work{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:920px){.work{grid-template-columns:minmax(0,1fr)}}
.bench{background:var(--panel);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;min-width:0}
.stage{padding:clamp(16px,2.4vw,28px);min-height:300px;display:flex;flex-direction:column;gap:20px;overflow-x:auto}
.controls{border-top:1px solid var(--line);background:var(--sunk);border-radius:0 0 16px 16px;padding:16px clamp(14px,2vw,22px);display:flex;flex-wrap:wrap;gap:14px 18px;align-items:flex-end}
.controls:empty{display:none}
.side{display:flex;flex-direction:column;gap:8px;min-width:0}
.plabel{font:700 .72rem var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:6px}
pre.code{background:var(--code-bg);color:var(--code-fg);font:400 .9rem/1.65 var(--mono);padding:14px 0;border-radius:12px;margin:0;overflow-x:auto;tab-size:4}
pre.code .ln{display:block;padding:0 16px;white-space:pre}
pre.code .ln.on{background:var(--code-line);box-shadow:inset 3px 0 0 var(--code-kw)}
pre.code .ln.skip{opacity:.38}
pre.code .ln.ran{background:color-mix(in srgb,var(--code-str) 14%,transparent)}
.c-kw{color:var(--code-kw)}.c-str{color:var(--code-str)}.c-num{color:var(--code-num)}.c-com{color:var(--code-com);font-style:italic}.c-fn{color:var(--code-fn)}
.out{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:.9rem/1.6 var(--mono);white-space:pre-wrap;word-break:break-word;min-height:3.2em;tab-size:8;overflow-x:auto}
.out.err{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.out.muted{color:var(--muted)}
.tip{font-size:.95rem;color:var(--muted);padding:10px 0 0;border-top:1px dashed var(--line);margin-top:6px}
.tip b{color:var(--ink)}

/* controls */
.ctl{display:flex;flex-direction:column;gap:5px;min-width:0}
.ctl>label{font:700 .74rem var(--body);color:var(--muted);letter-spacing:.04em}
.ctl>label output{font:700 .82rem var(--mono);color:var(--blue);margin-left:4px}
.ctl input[type=text],.ctl select,.ctl textarea{background:var(--panel);border:2px solid var(--line);border-radius:9px;padding:.42rem .6rem;font:500 .95rem var(--mono);min-width:0;max-width:100%}
.ctl input[type=text]{width:11rem}.ctl input.wide{width:17rem}
.ctl textarea{width:min(26rem,100%);resize:vertical;line-height:1.5}
.ctl input[type=range]{width:9.5rem;accent-color:var(--blue)}
.ctl.check{flex-direction:row;align-items:center;gap:8px;padding-bottom:8px}
.ctl.check input{width:18px;height:18px;accent-color:var(--blue)}
.ctl.check label{font:600 .9rem var(--body);color:var(--ink);letter-spacing:0}
.ctl-sub{display:contents}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:600 .92rem var(--body);padding:.45rem .85rem;border:2px solid var(--blue);color:var(--blue);background:var(--panel);border-radius:9px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--blue-soft)}
.btn.primary{background:var(--blue);color:var(--panel)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.warn{border-color:var(--red);color:var(--red)}
.btn.warn:hover{background:var(--red-soft)}
.btn.mono{font-family:var(--mono);font-weight:600;font-size:.86rem}
.btn:disabled{opacity:.4;cursor:default}

/* visual atoms */
.row{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:center}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.cap{font:700 .74rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cells{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.cell{display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.box{min-width:52px;height:52px;padding:0 10px;display:grid;place-items:center;border:2px solid var(--blue);border-radius:10px;background:var(--panel);font:600 1.25rem var(--mono);white-space:pre;transition:background .2s,border-color .2s,opacity .2s}
.cells.small .box{min-width:40px;height:40px;font-size:1rem;padding:0 7px}
.box.soft{border-style:dashed;color:var(--muted)}
.box.hl{background:var(--orange-soft);border-color:var(--orange)}
.box.done{background:var(--blue-soft)}
.box.dim{opacity:.32}
.box.ok,.box.new{background:var(--green-soft);border-color:var(--green)}
.box.bad{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.box.ca{background:var(--blue-soft)}
.box.cb{background:var(--orange-soft);border-color:var(--orange)}
.box.cv,.box.nl{background:var(--violet-soft);border-color:var(--violet);color:var(--violet)}
.box.t-int{background:var(--blue-soft)}
.box.t-float{background:var(--green-soft);border-color:var(--green)}
.box.t-str{background:var(--orange-soft);border-color:var(--orange)}
.box.t-bool{background:var(--violet-soft);border-color:var(--violet)}
.box.t-NoneType{background:var(--sunk);border-color:var(--muted)}
.ix{font:700 .78rem var(--mono);color:var(--blue);font-variant-numeric:tabular-nums}
.ix.neg{color:var(--orange)}
.badge{position:absolute;top:-9px;right:-7px;z-index:1;min-width:22px;height:22px;border-radius:11px;background:var(--orange);color:var(--panel);font:700 .74rem/22px var(--mono);text-align:center;padding:0 5px}
.empty{font:500 1rem var(--mono);color:var(--muted);padding:12px 16px;border:2px dashed var(--line);border-radius:10px}
.qrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qmark{font:600 3rem/1 var(--display);color:var(--orange)}
.op{font:600 2rem/1 var(--display);color:var(--blue);padding:0 4px}
.arrow{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--orange)}
.arrow .a{font:600 2.2rem/1 var(--display)}
.arrow .l{font:600 .8rem var(--mono);white-space:nowrap}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{background:var(--sunk);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:1px;min-width:0}
.stat .k{font:500 .78rem var(--mono);color:var(--muted)}
.stat .v{font:700 1.08rem var(--mono);font-variant-numeric:tabular-nums}
.vars{display:flex;flex-wrap:wrap;gap:12px}
.var{display:flex;align-items:stretch;border:2px solid var(--violet);border-radius:10px;overflow:hidden;font:600 1.05rem var(--mono)}
.var .n{background:var(--violet);color:var(--panel);padding:6px 10px}
.var .v{padding:6px 12px;background:var(--panel);min-width:3.5em}
.tag{display:inline-flex;align-items:center;gap:6px;font:700 1rem var(--mono);color:var(--violet);background:var(--violet-soft);border:2px solid var(--violet);border-radius:999px;padding:4px 12px;white-space:nowrap}
.tile{background:var(--orange-soft);border:2px solid var(--orange);border-radius:12px;padding:10px 16px;font:700 1.5rem var(--mono);display:inline-flex;align-items:center;gap:10px;max-width:100%;overflow-x:auto}
.tile small{font:600 .8rem var(--body);color:var(--muted)}
.errbox{background:var(--red-soft);border:2px solid var(--red);color:var(--red);border-radius:12px;padding:10px 14px;font:600 .92rem/1.5 var(--mono);white-space:pre-wrap;max-width:100%}
.okbox{background:var(--green-soft);border:2px solid var(--green);color:var(--green);border-radius:12px;padding:10px 14px;font:600 .92rem/1.5 var(--mono);white-space:pre-wrap}
.note{font-size:.95rem;color:var(--muted);max-width:62ch;margin:0}
.panel{border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;background:var(--panel)}
.panel.sunk{background:var(--sunk);border-color:transparent}
.panel h3{font:600 1.15rem var(--display);margin:0}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}

/* 2D grid */
.grid{display:inline-grid;gap:6px;align-items:center}
.g{min-width:48px;height:44px;display:grid;place-items:center;border:2px solid var(--blue);border-radius:9px;background:var(--panel);font:600 1.05rem var(--mono);padding:0 8px;cursor:default;font-variant-numeric:tabular-nums;transition:background .2s,opacity .2s}
.g.click{cursor:pointer}.g.click:hover{border-color:var(--orange)}
.g.lab{border:none;background:none;color:var(--blue);font-size:.8rem;min-width:28px}
.g.rowhl{background:var(--blue-soft)}
.g.hl{background:var(--orange-soft);border-color:var(--orange)}
.g.res{background:var(--green-soft);border-color:var(--green)}
.g.dim{opacity:.3}

/* tables */
.tw{overflow-x:auto;max-width:100%}
table.df{border-collapse:separate;border-spacing:0;font:.92rem var(--mono);font-variant-numeric:tabular-nums}
table.df th,table.df td{padding:.42rem .75rem;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;transition:background .2s,opacity .2s}
table.df th{background:var(--blue-soft);font-weight:700}
table.df th:first-child{border-top-left-radius:8px}table.df th:last-child{border-top-right-radius:8px}
table.df td.ix,table.df th.ix{color:var(--muted);text-align:left;font-weight:700}
table.df td.s{text-align:left}
table.df td.nan{color:var(--red);background:var(--red-soft);font-style:italic}
table.df tr.keep td{background:var(--green-soft)}
table.df tr.drop td{opacity:.3}
table.df .colhl{background:var(--orange-soft)}
table.df th.colhl{background:var(--orange-soft);color:var(--orange)}
table.df td.chg{background:var(--green-soft);color:var(--green);font-weight:700}
table.df td.T{color:var(--green);font-weight:700}table.df td.F{color:var(--muted)}
table.df.mini{font-size:.82rem}table.df.mini th,table.df.mini td{padding:.3rem .55rem}

/* files and trees */
.file{border:2px solid var(--line);border-radius:12px;overflow:hidden;min-width:0;background:var(--panel)}
.file.on{border-color:var(--orange)}
.file-h{background:var(--sunk);padding:6px 12px;font:700 .85rem var(--mono);display:flex;justify-content:space-between;gap:8px}
.file pre{margin:0;padding:10px 0;font:.86rem/1.6 var(--mono);overflow-x:auto}
.file pre .ln{display:block;padding:0 12px;white-space:pre}
.file pre .ln.on{background:var(--orange-soft)}
.file pre .ln.ran{background:var(--green-soft)}
.file pre .ln.skip{opacity:.35}
.file pre .c-kw{color:var(--orange)}.file pre .c-str{color:var(--green)}.file pre .c-num{color:var(--blue)}.file pre .c-com{color:var(--muted)}.file pre .c-fn{color:var(--violet)}
.tree{display:flex;flex-direction:column;gap:3px;font:.95rem var(--mono)}
.node{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:8px;border:2px solid transparent;background:none;text-align:left;cursor:pointer;white-space:pre}
.node:hover{background:var(--sunk)}
.node.on{border-color:var(--orange);background:var(--orange-soft)}
.node.tgt{border-color:var(--blue);background:var(--blue-soft)}
.node .ic{font-weight:700;width:1.4em;text-align:center;color:var(--blue)}
.node.dir .ic{color:var(--orange)}
.node.new{animation:pop .5s}
.node .why{font:600 .75rem var(--body);color:var(--muted);margin-left:6px}
.toolbox{border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:border-color .2s,background .2s}
.toolbox.on{border-color:var(--blue);background:var(--blue-soft)}
.toolbox h4{margin:0;font:700 1rem var(--mono)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 .82rem var(--mono);padding:3px 9px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel)}
.chip.on{border-color:var(--orange);background:var(--orange-soft);color:var(--orange)}
.chip.mod{border-color:var(--blue);color:var(--blue)}
.chip.bad{border-color:var(--red);color:var(--red);background:var(--red-soft);text-decoration:line-through}
.nest{border:2px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;transition:border-color .2s,background .2s;min-width:0}
.nest.on{border-color:var(--orange);background:var(--orange-soft)}
.nest .nh{font:700 .95rem var(--mono);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nest .nh span{font:600 .74rem var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--orange)}
.flowv{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.fstep{display:flex;gap:10px;align-items:center;font:600 .92rem var(--mono);padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--panel);transition:all .25s}
.fstep .num{width:24px;height:24px;border-radius:50%;background:var(--line);color:var(--panel);font:700 .78rem/24px var(--mono);text-align:center}
.fstep.on{border-color:var(--green);background:var(--green-soft)}
.fstep.on .num{background:var(--green)}
.fstep.off{opacity:.4}
.fstep.bad{border-color:var(--red);background:var(--red-soft)}
.fstep.bad .num{background:var(--red)}

/* charts */
.chart{width:100%;max-width:680px;height:auto;display:block}
.chart text{font-family:var(--body);fill:var(--muted);font-size:13px}
.chart .ttl{font:600 17px var(--display);fill:var(--ink)}
.chart .axl{font-size:14px;fill:var(--ink);font-weight:600}
.chart .fig{fill:var(--panel)}
.chart .axes{fill:none}
.chart .gridl{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--ink);stroke-width:1.5}
.chart .val{fill:var(--ink);font-weight:700;font-size:12px}
.chart .glow{stroke:var(--orange)!important;stroke-width:4!important}
.chart text.glow{fill:var(--orange)!important;stroke:none!important;font-weight:700}
.chart rect.glow{fill:color-mix(in srgb,var(--orange) 14%,transparent)!important}
.bars{display:flex;align-items:flex-end;gap:10px;height:220px;padding:0 8px;border-bottom:2px solid var(--ink);position:relative;min-width:0}
.barc{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;flex:1;min-width:36px;height:100%}
.bar{width:100%;max-width:56px;background:var(--blue);border-radius:6px 6px 0 0;transition:height .35s,background .2s}
.bar.hl{background:var(--orange)}.bar.dim{opacity:.3}
.barv{font:700 .82rem var(--mono)}
.barlabels{display:flex;gap:10px;padding:0 8px}.barlabels span{flex:1;min-width:36px;text-align:center;font:600 .8rem var(--body);color:var(--muted)}
.meanline{position:absolute;left:0;right:0;border-top:2px dashed var(--orange)}
.meanline span{position:absolute;right:4px;top:-1.5em;font:700 .78rem var(--mono);color:var(--orange);background:var(--panel);padding:0 4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:560px){.box{min-width:42px;height:44px;font-size:1.05rem}.qmark{font-size:2.2rem}#modSel,#topSel{width:100%}.pick{flex:1 1 100%}.ctl input[type=text],.ctl input.wide{width:100%}}
</style>

</head>
<body>
<style>.homebar{max-width:1280px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}.homebar a{font:700 .9rem var(--body);color:var(--blue);text-decoration:none}.homebar a:hover{text-decoration:underline}</style><div class="homebar"><a href="/">← Class 10 Python home</a></div><div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="prompt" aria-hidden="true">&gt;&gt;&gt;</span>
      <div><h1>Python Visual Lab</h1><p>Class 10 · one live visual for every lesson</p></div>
    </div>
    <div class="pickers">
      <label class="pick" for="modSel">Module<select id="modSel"></select></label>
      <label class="pick" for="topSel">Topic<select id="topSel"></select></label>
      <div class="nav"><button type="button" id="prevBtn" aria-label="Previous topic">←</button><span id="pos">1 / 49</span><button type="button" id="nextBtn" aria-label="Next topic">→</button></div>
    </div>
  </header>

<script>
'use strict';
const MODULES=[{id:'str',name:'Strings'},{id:'list',name:'Lists'},{id:'mod',name:'Modules & Packages'},{id:'np',name:'NumPy'},{id:'pd',name:'Pandas'},{id:'plt',name:'Matplotlib'}];
const TOPICS=[];
function topic(mod,id,title,blurb,tip,build){TOPICS.push({mod,id,title,blurb,tip,build});}
const $=(s,el=document)=>el.querySelector(s);
/* skip empty slots (null/false) when adding children */
['replaceChildren','append'].forEach(fn=>{const orig=Element.prototype[fn];Element.prototype[fn]=function(...k){return orig.apply(this,k.flat(Infinity).filter(x=>x!=null&&x!==false));};});
const REDUCED=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

function h(tag,props,...kids){
  const el=document.createElement(tag);
  if(props)for(const [k,v] of Object.entries(props)){
    if(v==null||v===false)continue;
    if(k==='class')el.className=v;
    else if(k==='style')el.style.cssText=v;
    else if(k.startsWith('on')&&typeof v==='function')el.addEventListener(k.slice(2),v);
    else if(k==='text')el.textContent=v;
    else if(k==='html')el.innerHTML=v;
    else if(k==='value')el.value=v;
    else el.setAttribute(k,v===true?'':v);
  }
  for(const kid of kids.flat(Infinity)){if(kid==null||kid===false)continue;el.append(kid instanceof Node?kid:document.createTextNode(String(kid)));}
  return el;
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- python-ish highlighting ---------- */
const KW=new Set('False None True and as def elif else for from if import in is not or return while lambda pass'.split(' '));
const BI=new Set('print len range type str int float list input sum min max sorted round bool tuple dict'.split(' '));
function hlLines(src){
  const re=/(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)/g;
  const out=[[]];let last=0;
  const push=(text,cls)=>{text.split('\n').forEach((p,k)=>{if(k>0)out.push([]);if(p)out[out.length-1].push(cls?`<span class="${cls}">${esc(p)}</span>`:esc(p));});};
  let m;while((m=re.exec(src))){
    push(src.slice(last,m.index));
    let cls=null;if(m[1])cls='c-com';else if(m[2])cls='c-str';else if(m[3])cls='c-num';else if(KW.has(m[4]))cls='c-kw';else if(BI.has(m[4]))cls='c-fn';
    push(m[0],cls);last=m.index+m[0].length;
  }
  push(src.slice(last));
  return out.map(a=>a.join(''));
}
function codeHTML(src,lineCls){return hlLines(src).map((l,i)=>`<span class="ln ${lineCls?lineCls(i)||'':''}">${l||' '}</span>`).join('');}
function codeBlock(src,lineCls){const p=h('pre');p.innerHTML=codeHTML(src,lineCls);return p;}
function fileCard(name,src,lineCls,{on=false,note}={}){return h('div',{class:'file'+(on?' on':'')},h('div',{class:'file-h'},h('span',{},name),note?h('span',{style:'color:var(--muted);font-weight:600'},note):null),codeBlock(src,lineCls));}

/* ---------- python value formatting ---------- */
function pyStr(s){let q="'";if(s.includes("'")&&!s.includes('"'))q='"';let r='';for(const c of s){if(c==='\\')r+='\\\\';else if(c==='\n')r+='\\n';else if(c==='\t')r+='\\t';else if(c===q)r+='\\'+q;else r+=c;}return q+r+q;}
function pyFloat(v){if(!isFinite(v))return isNaN(v)?'nan':(v>0?'inf':'-inf');if(Number.isInteger(v)&&Math.abs(v)<1e16)return v.toFixed(1);return String(v);}
function pyVal(v){
  if(typeof v==='string')return pyStr(v);
  if(typeof v==='boolean')return v?'True':'False';
  if(v===null||v===undefined)return 'None';
  if(Array.isArray(v))return '['+v.map(pyVal).join(', ')+']';
  if(typeof v==='object'&&'src' in v)return v.src;
  if(typeof v==='object'&&v.f!==undefined)return pyFloat(v.f);
  return String(v);
}
const visCh=c=>c===' '?'␣':c==='\n'?'↵':c==='\t'?'⇥':c;

/* python slice semantics */
function sliceIdx(n,start,stop,step){
  if(step==null)step=1;
  if(step===0)throw new Error('ValueError: slice step cannot be zero');
  const r=[];
  if(step>0){
    if(start==null)start=0;else if(start<0){start+=n;if(start<0)start=0;}else if(start>n)start=n;
    if(stop==null)stop=n;else if(stop<0){stop+=n;if(stop<0)stop=0;}else if(stop>n)stop=n;
    for(let i=start;i<stop;i+=step)r.push(i);
  }else{
    if(start==null)start=n-1;else if(start<0){start+=n;if(start<0)start=-1;}else if(start>=n)start=n-1;
    if(stop==null)stop=-1;else if(stop<0){stop+=n;if(stop<0)stop=-1;}else if(stop>=n)stop=n-1;
    for(let i=start;i>stop;i+=step)r.push(i);
  }
  return r;
}

/* parse comma separated python literals */
function lit(t){
  if(/^(['"])[\s\S]*\1$/.test(t)&&t.length>=2)return {type:'str',val:t.slice(1,-1),src:pyStr(t.slice(1,-1))};
  if(t==='True'||t==='False')return {type:'bool',val:t==='True',src:t};
  if(t==='None')return {type:'NoneType',val:null,src:'None'};
  if(/^[-+]?\d+$/.test(t)){const v=parseInt(t,10);return {type:'int',val:v,src:String(v)};}
  if(/^[-+]?(\d+\.\d*|\.\d+)(e[-+]?\d+)?$/i.test(t)){const v=parseFloat(t);return {type:'float',val:v,src:pyFloat(v)};}
  return {type:'?',src:t};
}
function parseLits(text){
  const toks=[];let cur='',q=null;
  for(const c of text){if(q){cur+=c;if(c===q)q=null;continue;}if(c==='"'||c==="'"){q=c;cur+=c;continue;}if(c===','){toks.push(cur);cur='';continue;}cur+=c;}
  if(q)return {error:'SyntaxError: unterminated string literal'};
  toks.push(cur);
  if(toks.length===1&&toks[0].trim()==='')return {items:[]};
  const items=[];
  for(let i=0;i<toks.length;i++){
    const t=toks[i].trim();
    if(t===''){if(i===toks.length-1&&i>0)continue;return {error:'SyntaxError: invalid syntax (two commas with nothing between)'};}
    const it=lit(t);
    if(it.type==='?')return {error:`NameError: name '${t.split(/\s/)[0]}' is not defined\n(put text inside quotes)`};
    items.push(it);
  }
  return {items};
}
function parseNums(text){const r=parseLits(text);if(r.error)return r;const bad=r.items.find(i=>i.type!=='int'&&i.type!=='float');if(bad)return {error:`Use numbers only here (found ${bad.src})`};return {nums:r.items.map(i=>i.val),items:r.items};}

/* ---------- numpy-style formatting ---------- */
function fmtF(v){let s=String(+v.toFixed(8));if(s.includes('e'))s=v.toExponential(4);if(!s.includes('.')&&!s.includes('e'))s+='.';return s;}
function npParts(vals,dtype){
  if(dtype==='bool')return vals.map(v=>v?'True':'False').map(s=>s.padStart(5));
  if(dtype.startsWith('<U'))return vals.map(v=>`'${v}'`);
  if(dtype.startsWith('int')){const s=vals.map(v=>String(v));const w=Math.max(...s.map(x=>x.length));return s.map(x=>x.padStart(w));}
  const s=vals.map(fmtF);
  const ip=s.map(x=>x.split('.')[0]),fp=s.map(x=>x.split('.')[1]||'');
  const wi=Math.max(...ip.map(x=>x.length)),wf=Math.max(...fp.map(x=>x.length));
  return s.map((_,i)=>ip[i].padStart(wi)+'.'+fp[i].padEnd(wf));
}
function npRepr(arr,dtype){
  if(!Array.isArray(arr))return dtype==='bool'?(arr?'True':'False'):dtype.startsWith('int')?String(arr):pyFloat(arr);
  if(arr.length===0)return '[]';
  if(Array.isArray(arr[0])){
    const flat=npParts(arr.flat(),dtype);const c=arr[0].length;
    const rows=arr.map((_,r)=>'['+flat.slice(r*c,r*c+c).join(' ')+']');
    return '['+rows.join('\n ')+']';
  }
  return '['+npParts(arr,dtype).join(' ')+']';
}
function dtypeOf(nums){return nums.every(Number.isInteger)?'int64':'float64';}

/* ---------- controls ---------- */
let CTLN=0;
function Text(label,value,cb,{wide=false,ph=''}={}){const id='ctl'+(++CTLN);const i=h('input',{type:'text',id,value,placeholder:ph,spellcheck:'false',autocomplete:'off',class:wide?'wide':null,oninput:e=>cb(e.target.value)});const w=h('div',{class:'ctl'},h('label',{for:id},label),i);w.input=i;return w;}
function Area(label,value,cb,rows=4){const id='ctl'+(++CTLN);const i=h('textarea',{id,rows,spellcheck:'false',oninput:e=>cb(e.target.value)});i.value=value;const w=h('div',{class:'ctl'},h('label',{for:id},label),i);w.input=i;return w;}
function Range(label,min,max,value,cb,{step=1,fmt=v=>v}={}){const id='ctl'+(++CTLN);const o=h('output',{},fmt(value));const i=h('input',{type:'range',id,min,max,step,value,oninput:e=>{const v=+e.target.value;o.textContent=fmt(v);cb(v);}});const w=h('div',{class:'ctl'},h('label',{for:id},label,o),i);w.input=i;w.set=v=>{i.value=v;o.textContent=fmt(+v);};return w;}
function Select(label,opts,value,cb){const id='ctl'+(++CTLN);const s=h('select',{id,onchange:e=>cb(e.target.value)},opts.map(o=>{const [v,t]=Array.isArray(o)?o:[o,o];return h('option',{value:v},t);}));s.value=value;const w=h('div',{class:'ctl'},h('label',{for:id},label),s);w.input=s;return w;}
function Check(label,checked,cb){const id='ctl'+(++CTLN);const i=h('input',{type:'checkbox',id,onchange:e=>cb(e.target.checked)});i.checked=checked;const w=h('div',{class:'ctl check'},i,h('label',{for:id},label));w.input=i;return w;}
function Btn(text,fn,kind){return h('button',{type:'button',class:'btn'+(kind?' '+kind:''),onclick:fn},text);}
function Btns(...list){return h('div',{class:'btns'},list.map(b=>Array.isArray(b)?Btn(...b):b));}

/* ---------- visual atoms ---------- */
function cellRow(items,{idx=true,neg=false,cls,badge,small}={}){
  const n=items.length;
  if(!n)return h('div',{class:'empty'},'empty');
  return h('div',{class:'cells'+(small?' small':'')},items.map((t,i)=>{const b=badge?badge(i):null;return h('div',{class:'cell'},b!=null?h('span',{class:'badge'},b):null,h('div',{class:'box '+(cls?cls(i)||'':'')},t),idx?h('span',{class:'ix'},i):null,neg?h('span',{class:'ix neg'},i-n):null);}));
}
function stats(pairs){return h('div',{class:'stats'},pairs.map(([k,v])=>h('div',{class:'stat'},h('span',{class:'k'},k),h('span',{class:'v'},v))));}
function arrow(label,dir='right'){return h('div',{class:'arrow'},h('span',{class:'a'},dir==='down'?'↓':'→'),label?h('span',{class:'l'},label):null);}
function cap(t){return h('div',{class:'cap'},t);}
function varTag(n,v){return h('div',{class:'var'},h('span',{class:'n'},n),h('span',{class:'v'},v));}
function brackets(inner,open='[',close=']'){return h('div',{class:'qrow'},h('span',{class:'qmark'},open),inner,h('span',{class:'qmark'},close));}
function errbox(t){return h('div',{class:'errbox shake'},t);}
function grid2(M,{cls,click,rowLab,colLab,labels=true}={}){
  const R=M.length,C=M[0]?M[0].length:0;
  const g=h('div',{class:'grid',style:`grid-template-columns:${labels?'auto ':''}repeat(${C},auto)`});
  if(labels){g.append(h('div',{class:'g lab'},''));for(let c=0;c<C;c++)g.append(h('div',{class:'g lab'},colLab?colLab(c):c));}
  for(let r=0;r<R;r++){
    if(labels)g.append(h('div',{class:'g lab'},rowLab?rowLab(r):r));
    for(let c=0;c<C;c++){const el=h('div',{class:'g '+(cls?cls(r,c)||'':'')+(click?' click':''),onclick:click?()=>click(r,c):null,role:click?'button':null,tabindex:click?'0':null},M[r][c]);if(click)el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();click(r,c);}});g.append(el);}
  }
  return g;
}

/* step-through player */
function Stepper(ctx,getN,onStep,onReset,speed=800){
  let i=-1,t=null;
  const play=Btn('Play',()=>toggle(),'primary');
  function step(){const n=getN();if(i>=n-1){stop();return;}i++;onStep(i);if(i>=n-1)stop();}
  function stop(){if(t){clearInterval(t);t=null;}play.textContent=i>=getN()-1&&i>=0?'Replay':'Play';}
  function toggle(){if(t){stop();return;}if(i>=getN()-1){i=-1;onReset();}play.textContent='Pause';step();if(i<getN()-1)t=ctx.every(speed,step);else stop();}
  function reset(){if(t){clearInterval(t);t=null;}i=-1;play.textContent='Play';onReset();}
  return {el:Btns(play,Btn('Step',()=>{if(t){clearInterval(t);t=null;}step();play.textContent=i>=getN()-1?'Replay':'Play';}),Btn('Reset',reset)),reset,get i(){return i;}};
}

/* reorder animation */
function flip(container,mutate){
  const first=new Map();container.querySelectorAll('[data-k]').forEach(el=>first.set(el.dataset.k,el.getBoundingClientRect()));
  mutate();
  if(REDUCED)return;
  container.querySelectorAll('[data-k]').forEach(el=>{const f=first.get(el.dataset.k);if(!f)return;const l=el.getBoundingClientRect();const dx=f.left-l.left,dy=f.top-l.top;if(dx||dy)el.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:480,easing:'cubic-bezier(.2,.7,.2,1)'});});
}
const seq=(a,b)=>Array.from({length:b-a},(_,i)=>a+i);
const sum=a=>a.reduce((x,y)=>x+y,0);
const mean=a=>sum(a)/a.length;
function median(a){const s=[...a].sort((x,y)=>x-y),n=s.length;return n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2;}
function stdev(a,ddof=0){const m=mean(a);return Math.sqrt(sum(a.map(x=>(x-m)**2))/(a.length-ddof));}
function quantile(a,q){const s=[...a].sort((x,y)=>x-y);const p=(s.length-1)*q,lo=Math.floor(p),hi=Math.ceil(p);return s[lo]+(s[hi]-s[lo])*(p-lo);}
/* =================== STRINGS =================== */
topic('str','str-intro','Introduction to strings',
'A string is text. Python stores it as a row of characters, in order, between quotes. Type anything and watch it split into characters.',
'Spaces, digits and punctuation are characters too. On screen <b>␣</b> stands for a space so you can see it.',
ctx=>{
  let s='Python 3';
  const draw=()=>{
    const ch=[...s];const k={letters:0,digits:0,spaces:0,other:0};
    ch.forEach(c=>{if(/\p{L}/u.test(c))k.letters++;else if(/\d/.test(c))k.digits++;else if(/\s/.test(c))k.spaces++;else k.other++;});
    ctx.stage.replaceChildren(
      h('div',{class:'row'},h('span',{class:'tag'},'word'),arrow()),
      brackets(ch.length?cellRow(ch.map(visCh),{cls:i=>/\s/.test(ch[i])?'soft':''}):h('div',{class:'empty'},'empty string'),'"','"'),
      stats([['len(word)',ch.length],['letters',k.letters],['digits',k.digits],['spaces',k.spaces],['other',k.other],['type',"str"]]));
    ctx.code(`word = ${pyStr(s)}\nprint(word)\nprint(len(word))\nprint(type(word))`);
    ctx.out(`${s}\n${ch.length}\n<class 'str'>`);
  };
  ctx.add(Text('word =',s,v=>{s=v;draw();},{wide:true}));
  draw();
});

topic('str','str-create','Creating a string',
'There are a few ways to make a string. Pick one, change the text, and see what Python accepts.',
'If the text has an apostrophe, wrap it in <b>double quotes</b>. The quote marks are not part of the string.',
ctx=>{
  let way='single',text="It's fun",typed='Asha',num=15;
  const sub=h('div',{class:'ctl-sub'});
  const ways=[['single',"Single quotes  ' '"],['double','Double quotes  " "'],['triple','Triple quotes  """ """'],['input','From the keyboard: input()'],['str','From a number: str()']];
  const controls=()=>{
    sub.replaceChildren();
    if(['single','double','triple'].includes(way))sub.append(Text('text',text,v=>{text=v;draw();},{wide:true}));
    else if(way==='input')sub.append(Text('the user types',typed,v=>{typed=v;draw();}));
    else sub.append(Range('n =',0,999,num,v=>{num=v;draw();}));
  };
  const draw=()=>{
    let code,val=null,err=null,pre=null;
    if(way==='single'){code=`s = '${text}'`;if(text.includes("'"))err="SyntaxError: unterminated string literal\nThe ' inside the text ends the string too early.\nFix: use double quotes.";else val=text;}
    else if(way==='double'){code=`s = "${text}"`;if(text.includes('"'))err='SyntaxError: unterminated string literal\nThe " inside the text ends the string too early.\nFix: use single quotes.';else val=text;}
    else if(way==='triple'){code=`s = """${text}"""`;if(text.includes('"""'))err='SyntaxError: the text itself contains """';else val=text;}
    else if(way==='input'){code='s = input("Name: ")';val=typed;pre=h('div',{class:'panel sunk'},cap('Console'),h('div',{style:'font:600 1.05rem var(--mono)'},'Name: ',h('span',{style:'color:var(--blue)'},typed)));}
    else{code=`n = ${num}\ns = str(n)`;val=String(num);pre=h('div',{class:'row'},h('div',{class:'box cv',style:'min-width:80px'},num),h('span',{class:'note'},'int'),arrow('str(n)'));}
    code+='\nprint(s)\nprint(type(s))';
    const kids=[];if(pre)kids.push(pre);
    if(err){kids.push(errbox(err));ctx.out(err.split('\n')[0],'err');}
    else{
      kids.push(h('div',{class:'row'},h('span',{class:'tag'},'s'),arrow()),brackets(cellRow([...val].map(visCh),{cls:i=>val[i]===' '?'soft':''}),"'","'"));
      if(way==='input')kids.push(h('p',{class:'note'},'Whatever the user types comes back as a string, even if they type digits.'));
      if(way==='str')kids.push(h('p',{class:'note'},`The number ${num} became the text ${pyStr(val)}. You can no longer do maths with it until you convert it back with int().`));
      ctx.out(`${val}\n<class 'str'>`);
    }
    ctx.stage.replaceChildren(...kids);ctx.code(code);
  };
  ctx.add(Select('way',ways,way,v=>{way=v;controls();draw();}),sub);controls();draw();
});

topic('str','str-traverse','Traversing a string',
'Traversing means visiting every character, one at a time, from left to right. Press Play to run the loop.',
'Ask the class to predict what <b>ch</b> holds on the next turn before pressing Step.',
ctx=>{
  let word='Python',printed=[];
  const draw=i=>{
    const ch=[...word];
    ctx.stage.replaceChildren(cellRow(ch.map(visCh),{cls:k=>k===i?'hl':k<i?'done':''}),
      h('div',{class:'vars'},varTag('ch',i>=0?pyStr(ch[i]):'—'),varTag('turn',`${i+1} of ${ch.length}`)));
    ctx.code(`word = ${pyStr(word)}\nfor ch in word:\n    print(ch)`,i>=0?2:null);
    ctx.out(printed.length?printed.join('\n'):'Press Play or Step',printed.length?'':'muted');
  };
  const st=Stepper(ctx,()=>[...word].length,i=>{printed.push([...word][i]);draw(i);},()=>{printed=[];draw(-1);});
  ctx.add(Text('word =',word,v=>{word=v;st.reset();}),st.el);draw(-1);
});

topic('str','str-range','Range in a string',
'range(len(word)) gives the positions 0, 1, 2 … The loop visits each position, and word[i] fetches the character there.',
'Use this form when you need the <b>position</b> as well as the character.',
ctx=>{
  let word='Python',printed=[];
  const draw=i=>{
    const ch=[...word];
    ctx.stage.replaceChildren(
      cap(`range(len(word)) = range(${ch.length})`),cellRow(ch.map((_,k)=>String(k)),{idx:false,small:true,cls:k=>k===i?'hl':k<i?'done':'soft'}),
      cap('word'),cellRow(ch.map(visCh),{cls:k=>k===i?'hl':k<i?'done':''}),
      h('div',{class:'vars'},varTag('i',i>=0?i:'—'),varTag('word[i]',i>=0?pyStr(ch[i]):'—')));
    ctx.code(`word = ${pyStr(word)}\nfor i in range(len(word)):\n    print(i, word[i])`,i>=0?2:null);
    ctx.out(printed.length?printed.join('\n'):'Press Play or Step',printed.length?'':'muted');
  };
  const st=Stepper(ctx,()=>[...word].length,i=>{printed.push(i+' '+[...word][i]);draw(i);},()=>{printed=[];draw(-1);});
  ctx.add(Text('word =',word,v=>{word=v;st.reset();}),st.el);draw(-1);
});

topic('str','str-lines','Single-line vs multi-line strings',
'Triple quotes let a string run over several lines. The line break is stored as one hidden character, \\n.',
'Both ways store exactly the same string. Triple quotes are just easier to read for long text.',
ctx=>{
  let txt='Python is fun.\nPractise daily.',mode='triple';
  const draw=()=>{
    let code,err=null;
    if(mode==='triple')code=`note = """${txt}"""`;
    else if(mode==='escape')code=`note = ${pyStr(txt)}`;
    else{code=`note = "${txt}"`;if(txt.includes('\n'))err='SyntaxError: unterminated string literal\nOrdinary quotes cannot span lines.\nUse triple quotes, or write \\n for the break.';}
    code+='\nprint(note)\nprint(len(note))';
    const ch=[...txt];

/* shared slicing lab for strings and lists */
function sliceLab(ctx,{name,initial,parse,show,repr,label,start='1',stop='4',step=''}){
  let src=initial;
  const sub=h('div',{class:'ctl-sub'});
  const build=()=>{
    const p=parse(src);const N=p.items?p.items.length:0;
    const opt=[['','(blank)']];for(let k=-N;k<=N;k++)opt.push([String(k),String(k)]);
    const ok=v=>v===''||(+v>=-N&&+v<=N);if(!ok(start))start='';if(!ok(stop))stop='';
    sub.replaceChildren(Select('start',opt,start,v=>{start=v;draw();}),Select('stop',opt,stop,v=>{stop=v;draw();}),
      Select('step',[['','(blank)'],'1','2','3','-1','-2','-3',['0','0 (error)']],step,v=>{step=v;draw();}));
  };
  const draw=()=>{
    const p=parse(src);const expr=`${name}[${start}:${stop}${step!==''?':'+step:''}]`;
    ctx.code(`${name} = ${p.items?repr(p.items):src}\npart = ${expr}\nprint(part)`);
    if(p.error){ctx.stage.replaceChildren(errbox(p.error));ctx.out(p.error,'err');return;}
    const it=p.items;let idx;
    try{idx=sliceIdx(it.length,start===''?null:+start,stop===''?null:+stop,step===''?null:+step);}
    catch(e){ctx.stage.replaceChildren(cellRow(it.map(show),{neg:true}),errbox(e.message));ctx.out(e.message,'err');return;}
    const res=idx.map(i=>it[i]);const st=step===''?1:+step;
    ctx.stage.replaceChildren(
      h('div',{class:'row'},h('span',{class:'tag'},expr)),
      cellRow(it.map(show),{neg:true,cls:i=>idx.includes(i)?'hl':'dim',badge:i=>{const k=idx.indexOf(i);return k>=0?k+1:null;}}),
      h('p',{class:'note'},`Blue numbers count from the left, orange from the right. Orange badges show the order items are picked${st<0?' (backwards, because step is negative)':''}. The stop position is never included.`),
      arrow('result','down'),res.length?cellRow(res.map(show),{cls:()=>'ok'}):h('div',{class:'empty'},'empty'),
      stats([['picked indexes',idx.length?idx.join(', '):'none'],['length',res.length]]));
    ctx.out(repr(res));
  };
  ctx.add(Text(label,src,v=>{src=v;build();draw();},{wide:true}),sub);build();draw();
}

topic('str','str-methods','String methods',
'Methods are built-in tools you call with a dot: s.upper(), s.find("t"). Pick one, change the text, and see the result.',
'String methods <b>return a new value</b>. The original s stays exactly the same.',
ctx=>{
  let s='  Hello Python World  ',m='strip',a1='o',a2='0';
  const title=t=>{let out='',prev=false;for(const c of t){const cased=c.toLowerCase()!==c.toUpperCase();out+=cased?(prev?c.toLowerCase():c.toUpperCase()):c;prev=cased;}return out;};
  const occ=(t,sub)=>{const r=[];if(!sub)return r;let i=0;while((i=t.indexOf(sub,i))!==-1){for(let k=0;k<sub.length;k++)r.push(i+k);i+=sub.length;}return r;};
  const isCased=c=>c.toLowerCase()!==c.toUpperCase();
  const M={
    upper:{f:t=>t.toUpperCase()},lower:{f:t=>t.toLowerCase()},title:{f:title},
    capitalize:{f:t=>t?t[0].toUpperCase()+t.slice(1).toLowerCase():t},
    swapcase:{f:t=>[...t].map(c=>c===c.toUpperCase()?c.toLowerCase():c.toUpperCase()).join('')},
    strip:{f:t=>t.trim()},lstrip:{f:t=>t.replace(/^\s+/,'')},rstrip:{f:t=>t.replace(/\s+$/,'')},
    replace:{args:['old','new'],f:(t,x,y)=>x===''?y+[...t].join(y)+y:t.split(x).join(y),hl:(t,x)=>occ(t,x)},
    find:{args:['sub'],f:(t,x)=>t.indexOf(x),hl:(t,x)=>{const i=t.indexOf(x);return i<0?[]:seq(i,i+x.length);}},
    index:{args:['sub'],f:(t,x)=>{const i=t.indexOf(x);if(i<0)throw new Error('ValueError: substring not found');return i;},hl:(t,x)=>{const i=t.indexOf(x);return i<0?[]:seq(i,i+x.length);}},
    count:{args:['sub'],f:(t,x)=>x===''?[...t].length+1:t.split(x).length-1,hl:(t,x)=>occ(t,x)},
    startswith:{args:['prefix'],f:(t,x)=>t.startsWith(x),hl:(t,x)=>t.startsWith(x)?seq(0,x.length):[]},
    endswith:{args:['suffix'],f:(t,x)=>t.endsWith(x),hl:(t,x)=>t.endsWith(x)?seq(t.length-x.length,t.length):[]},
    split:{args:['sep (blank = spaces)'],f:(t,x)=>x===''?t.split(/\s+/).filter(Boolean):t.split(x)},
    isalpha:{f:t=>t.length>0&&[...t].every(c=>/\p{L}/u.test(c))},isdigit:{f:t=>t.length>0&&/^\d+$/.test(t)},
    isupper:{f:t=>[...t].some(isCased)&&t===t.toUpperCase()},islower:{f:t=>[...t].some(isCased)&&t===t.toLowerCase()},
    isspace:{f:t=>t.length>0&&/^\s+$/.test(t)},len:{f:t=>[...t].length,fn:true},
  };
  const sub=h('div',{class:'ctl-sub'});
  const controls=()=>{sub.replaceChildren();const ar=M[m].args||[];
    if(ar[0])sub.append(Text(ar[0],a1,v=>{a1=v;draw();}));if(ar[1])sub.append(Text(ar[1],a2,v=>{a2=v;draw();}));};
  const draw=()=>{
    const def=M[m];const ar=def.args||[];
    const call=def.fn?`len(s)`:`s.${m}(${ar.length===0?'':ar.length===1?(m==='split'&&a1===''?'':pyStr(a1)):pyStr(a1)+', '+pyStr(a2)})`;
    ctx.code(`s = ${pyStr(s)}\nresult = ${call}\nprint(result)`);
    const hl=def.hl?def.hl(s,a1):[];
    const top=[cap('s'),cellRow([...s].map(visCh),{cls:i=>hl.includes(i)?'hl':s[i]===' '?'soft':''}),arrow(call,'down')];
    let r;try{r=def.f(s,a1,a2);}catch(e){ctx.stage.replaceChildren(...top,errbox(e.message));ctx.out(e.message,'err');return;}
    let view,printed;
    if(typeof r==='string'){view=cellRow([...r].map(visCh),{cls:i=>r[i]===' '?'soft':'ok'});printed=r;}
    else if(Array.isArray(r)){view=brackets(h('div',{class:'chips'},r.map(x=>h('span',{class:'chip on'},pyStr(x)))));printed=pyVal(r);}
    else if(typeof r==='boolean'){view=h('div',{class:'tile'},r?'True':'False',h('small',{},'bool'));printed=r?'True':'False';}
    else{view=h('div',{class:'tile'},r,h('small',{},'int'));printed=String(r);}
    ctx.stage.replaceChildren(...top,view,h('p',{class:'note'},`s is unchanged: ${pyStr(s)}`));ctx.out(printed);
  };
  const names=Object.keys(M).map(k=>[k,M[k].fn?'len(s)':`${k}(${(M[k].args||[]).map(x=>x.split(' ')[0]).join(', ')})`]);
  ctx.add(Text('s =',s,v=>{s=v;draw();},{wide:true}),Select('method',names,m,v=>{m=v;if(v==='replace'){a1='o';a2='0';}else if(['find','index','count'].includes(v))a1='o';else if(v==='startswith')a1='  He';else if(v==='endswith')a1='ld  ';else if(v==='split')a1='';controls();draw();}),sub);
  controls();draw();
});

topic('list','list-methods','List methods',
'Pick a method, fill in its value, and press Run. Each call shows the list after the change and what the method returned.',
'append, insert, extend, remove, pop and clear <b>change</b> the list. index and count only <b>report</b>.',
ctx=>{
  let L=[5,8,2,8],m='append',x='7',ix=1,log=['nums = [5, 8, 2, 8]'],fl=[],ret=null,removed=null;
  const sig={append:['x'],insert:['i','x'],extend:['list'],remove:['x'],pop:[],popi:['i'],index:['x'],count:['x'],clear:[]};
  const sub=h('div',{class:'ctl-sub'});
  const controls=()=>{sub.replaceChildren();const s=sig[m];
    if(s.includes('i'))sub.append(Range('i',-4,6,ix,v=>{ix=v;}));
    if(s.includes('x'))sub.append(Text('x',x,v=>{x=v;}));
    if(s.includes('list'))sub.append(Text('items to add',x,v=>{x=v;},{ph:'1, 2'}));};
  const draw=()=>{ctx.stage.replaceChildren(h('div',{class:'row'},h('span',{class:'tag'},'nums')),brackets(cellRow(L.map(pyVal),{neg:true,cls:i=>fl.includes(i)?'new pop':''})),
      h('div',{class:'row'},removed!=null?h('span',{class:'chip bad'},'removed '+pyVal(removed)):null,h('span',{class:'chip'},'returned: '+(ret===null?'None':ret))),stats([['len(nums)',L.length]]));
    ctx.code(log.join('\n'),log.length-1);};
  const run=()=>{
    fl=[];removed=null;ret=null;
    const p=parseLits(x);const val=p.items&&p.items[0]?p.items[0].val:null;const vsrc=p.items&&p.items[0]?p.items[0].src:x;
    const same=(a,b)=>a===b;let line;
    try{
      if(['append','insert','remove','index','count'].includes(m)&&(p.error||p.items.length!==1))throw new Error(p.error||'Type exactly one value for x');
      if(m==='append'){line=`nums.append(${vsrc})`;L.push(val);fl=[L.length-1];}
      else if(m==='insert'){line=`nums.insert(${ix}, ${vsrc})`;let k=ix<0?Math.max(0,L.length+ix):Math.min(ix,L.length);L.splice(k,0,val);fl=[k];}
      else if(m==='extend'){if(p.error)throw new Error(p.error);line=`nums.extend([${x}])`;const s=L.length;L.push(...p.items.map(i=>i.val));fl=seq(s,L.length);}
      else if(m==='remove'){line=`nums.remove(${vsrc})`;const k=L.findIndex(v=>same(v,val));if(k<0)throw new Error('ValueError: list.remove(x): x not in list');removed=L.splice(k,1)[0];}
      else if(m==='pop'){line='nums.pop()';if(!L.length)throw new Error('IndexError: pop from empty list');removed=L.pop();ret=pyVal(removed);}
      else if(m==='popi'){line=`nums.pop(${ix})`;if(!L.length)throw new Error('IndexError: pop from empty list');const k=ix<0?ix+L.length:ix;if(k<0||k>=L.length)throw new Error('IndexError: pop index out of range');removed=L.splice(k,1)[0];ret=pyVal(removed);}
      else if(m==='index'){line=`nums.index(${vsrc})`;const k=L.findIndex(v=>same(v,val));if(k<0)throw new Error(`ValueError: ${vsrc} is not in list`);ret=String(k);fl=[k];}
      else if(m==='count'){line=`nums.count(${vsrc})`;const ks=L.map((v,k)=>same(v,val)?k:-1).filter(k=>k>=0);ret=String(ks.length);fl=ks;}
      else if(m==='clear'){line='nums.clear()';L=[];}
      log.push(line+(ret!==null?`   # returns ${ret}`:''));draw();ctx.out(pyVal(L));
    }catch(e){log.push((line||`nums.${m}(...)`)+'   # error');draw();ctx.out(e.message,'err');}
  };
  ctx.add(Select('method',[['append','append(x)'],['insert','insert(i, x)'],['extend','extend(list)'],['remove','remove(x)'],['pop','pop()'],['popi','pop(i)'],['index','index(x)'],['count','count(x)'],['clear','clear()']],m,v=>{m=v;if(v==='extend')x='1, 2';else if(['remove','index','count'].includes(v))x='8';controls();}),sub,
    Btns(Btn('Run',run,'primary'),Btn('Reset',()=>{L=[5,8,2,8];log=['nums = [5, 8, 2, 8]'];fl=[];ret=null;removed=null;draw();ctx.out('[5, 8, 2, 8]');})));
  controls();draw();ctx.out('[5, 8, 2, 8]');
});

topic('mod','mod-import','Import mechanics and syntax',

topic('mod','pkg-imports','Absolute vs relative imports',

  const idxOf={main:1,marks:4,att:5,card:8};
  let here='card',want='marks';

    const H=MODS[here],W=MODS[want];
    const abs=`from ${[...W.parts,W.mod].join('.')} import ${W.fn}`;let rel,relNote;
    if(here===want){rel=null;relNote='Same file: no import needed.';}
    else if(here==='main'){rel=null;relNote='main.py is not inside a package, so it cannot use relative imports. Use the absolute one.';}
    else{let k=0;while(k<H.parts.length&&k<W.parts.length&&H.parts[k]===W.parts[k])k++;const up=H.parts.length-k;rel=`from ${'.'.repeat(1+up)}${[...W.parts.slice(k),W.mod].join('.')} import ${W.fn}`;relNote=up===0?'One dot: start in my own package.':`${1+up} dots: start in my package, then go up ${up} folder${up>1?'s':''}.`;}

        cap('Relative'),rel?h('div',{class:'okbox'},rel):h('div',{class:'errbox'},'not possible here'),h('p',{class:'note'},relNote))));
    ctx.code(`# inside ${H.label}\n${abs}\n${rel?rel+'   # same thing':'# relative import not possible here'}`);ctx.out(rel?'Both lines import the same function.':relNote,rel?'':'muted');};
  const opts=Object.entries(MODS).map(([k,v])=>[k,v.label]);

topic('np','np-lists','Creating arrays from lists and tuples',
'np.array() turns a list or tuple into an array. Every element must end up the same type, so NumPy converts them if it has to.',

ctx=>{

  const conv=t=>{let s=t.trim();const isTuple=s.startsWith('(');s=s.replace(/\(/g,'[').replace(/\)/g,']').replace(/\bTrue\b/g,'true').replace(/\bFalse\b/g,'false').replace(/'([^'"]*)'/g,'"$1"');return {v:JSON.parse(s),isTuple};};
  const draw=()=>{
    ctx.code(`import numpy as np\narr = np.array(${txt})\nprint(arr)\nprint(arr.dtype, arr.shape)`);

    const nested=v.some(Array.isArray);
    if(nested&&(!v.every(Array.isArray)||new Set(v.map(r=>r.length)).size>1||v.some(r=>r.some(Array.isArray)))){

topic('np','np-dtypes','NumPy standard data types',
'Every array has one dtype. It decides what values fit and how many bytes each one takes. Pick a dtype and watch the values convert.',

ctx=>{
  let txt='1.7, 2, -3.9, 0, 120',dt='int32';
  const SIZE={int8:1,int32:4,int64:8,float32:4,float64:8,bool:1};
  const draw=()=>{
    const p=parseLits(txt);ctx.code(`import numpy as np\narr = np.array([${txt}], dtype="${dt}")\nprint(arr)\nprint(arr.itemsize, "bytes each")`);
    if(p.error){ctx.stage.replaceChildren(errbox(p.error));ctx.out(p.error,'err');return;}
    const it=p.items;let out,err=null,size=SIZE[dt],realDt=dt;
    if(dt==='str'){const w=Math.max(1,...it.map(x=>x.type==='str'?x.val.length:x.type==='int'?21:x.type==='float'?32:5));realDt='<U'+w;size=4*w;out=it.map(x=>x.type==='str'?x.val:x.src);}
    else{
      const bad=it.find(x=>x.type==='str'&&isNaN(+x.val)||x.type==='NoneType');
      if(bad)err=`ValueError: invalid literal for ${dt.startsWith('int')?'int() with base 10':'float()'}: ${bad.src}`;
      else{const nums=it.map(x=>x.type==='bool'?(x.val?1:0):+x.val);
        if(dt.startsWith('int')){out=nums.map(Math.trunc);const lim=dt==='int8'?[-128,127]:dt==='int32'?[-2147483648,2147483647]:[-Infinity,Infinity];const o=out.find(v=>v<lim[0]||v>lim[1]);if(o!==undefined)err=`OverflowError: Python integer ${o} out of bounds for ${dt}`;}
        else if(dt==='bool')out=nums.map(v=>v!==0);
        else out=nums.map(v=>dt==='float32'?+Math.fround(v).toPrecision(7):v);}
    }
    if(err){ctx.stage.replaceChildren(cellRow(it.map(x=>x.src),{idx:false}),errbox(err));ctx.out(err,'err');return;}
    const show=v=>realDt.startsWith('<U')?`'${v}'`:dt==='bool'?(v?'True':'False'):dt.startsWith('float')?fmtF(v):String(v);
    ctx.stage.replaceChildren(cap('values you wrote'),cellRow(it.map(x=>x.src),{idx:false,small:true}),arrow(`dtype="${dt}"`,'down'),

      h('p',{class:'note'},'Orange boxes changed when converted. Each purple square is one byte of memory.'),
      stats([['dtype',realDt],['itemsize',size+' bytes'],['nbytes (total)',size*out.length+' bytes']]));
    ctx.out(`${npRepr(out,realDt.startsWith('<U')?realDt:dt)}\n${size} bytes each`);
  };
  ctx.add(Text('values',txt,v=>{txt=v;draw();},{wide:true}),Select('dtype',['int8','int32','int64','float32','float64','bool',['str','str (text)']],dt,v=>{dt=v;draw();}),

});

/* =================== PANDAS =================== */
const STU=[
  {Name:'Asha',Section:'9A',Maths:88,Science:91,English:79},

  {Name:'Zoya',Section:'9A',Maths:81,Science:null,English:88},
  {Name:'Dev',Section:'9B',Maths:58,Science:62,English:71}].map((r,i)=>({...r,_i:i}));
const SCOLS=['Name','Section','Maths','Science','English'],NUMC=['Maths','Science','English'];
const DF_CODE='df = pd.DataFrame({\n    "Name": ["Asha", "Ravi", "Meera", "Kabir", "Zoya", "Dev"],\n    "Section": ["9A", "9B", "9A", "9B", "9A", "9B"],\n    "Maths": [88, 72, 95, 64, 81, 58],\n    "Science": [91, 68, 89, 70, None, 62],\n    "English": [79, 85, 92, None, 88, 71]\n})';
const isNumCol=(rows,c)=>rows.every(r=>typeof r[c]==='number'||r[c]==null);
const isFloatCol=(rows,c)=>isNumCol(rows,c)&&rows.some(r=>r[c]==null||!Number.isInteger(r[c]));
function cellTxt(v,f){if(v==null)return 'NaN';if(typeof v==='boolean')return v?'True':'False';if(typeof v==='number')return f?(Number.isInteger(v)?v.toFixed(1):String(+v.toFixed(6))):String(v);return v;}
function dfTable(rows,cols,{rowCls,cellCls,headCls,mini}={}){
  const fl={};cols.forEach(c=>fl[c]=isFloatCol(rows,c));
  return h('div',{class:'tw'},h('table',{class:'df'+(mini?' mini':'')},h('tr',{},h('th',{class:'ix'},''),cols.map(c=>h('th',{class:headCls?headCls(c)||'':''},c))),
    rows.map((r,i)=>h('tr',{class:rowCls?rowCls(r,i)||'':''},h('td',{class:'ix'+(cellCls&&cellCls('_ix',r,i)?' '+cellCls('_ix',r,i):'')},r._i??i),cols.map(c=>{const v=r[c];return h('td',{class:[v==null?'nan':'',typeof v==='string'?'s':'',typeof v==='boolean'?(v?'T':'F'):'',cellCls?cellCls(c,r,i)||'':''].join(' ')},cellTxt(v,fl[c]));})))));
}
function fmtVals(vals,forceFloat){if(!forceFloat&&vals.every(v=>typeof v==='number'&&Number.isInteger(v)))return {s:vals.map(String),dt:'int64'};
  if(vals.every(v=>v==null||typeof v==='number')){const allInt=vals.every(v=>v==null||Number.isInteger(v));return {s:vals.map(v=>v==null?'NaN':allInt?v.toFixed(1):v.toFixed(6)),dt:'float64'};}
  return {s:vals.map(v=>v==null?'NaN':String(v)),dt:'object'};}
function seriesRepr(labels,vals,{name,indexName,dtype}={}){
  const f=fmtVals(vals,dtype==='float64');const L=labels.map(String);const w1=Math.max(...L.map(s=>s.length)),w2=Math.max(...f.s.map(s=>s.length));
  return (indexName?indexName+'\n':'')+L.map((l,i)=>l.padEnd(w1)+'    '+f.s[i].padStart(w2)).join('\n')+'\n'+(name!=null?`Name: ${name}, `:'')+`dtype: ${dtype||f.dt}`;
}

function niceTicks(lo,hi,n=5){if(hi===lo)hi=lo+1;const span=hi-lo;const step0=span/n;const mag=10**Math.floor(Math.log10(step0));const f=step0/mag;const step=(f<1.5?1:f<3?2:f<7?5:10)*mag;const a=Math.floor(lo/step)*step,b=Math.ceil(hi/step)*step;const t=[];for(let x=a;x<=b+step/2;x+=step)t.push(+x.toFixed(6));return t;}
const PCOL={'tab:blue':'var(--blue)','tab:orange':'var(--orange)','tab:green':'var(--green)','tab:purple':'var(--violet)'};
function chartSVG(o){
  const W=640,H=400,m={l:64,r:24,t:o.title?52:24,b:58};const iw=W-m.l-m.r,ih=H-m.t-m.b;const col=PCOL[o.color]||'var(--blue)';
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${esc(o.title||o.type+' chart')}"><rect x="0" y="0" width="${W}" height="${H}" rx="12" class="fig"/>`;
  if(o.title)s+=`<text x="${m.l+iw/2}" y="30" text-anchor="middle" class="ttl">${esc(o.title)}</text>`;
  if(o.type==='pie'){
    const tot=sum(o.values);const cx=W/2,cy=m.t+ih/2,R=Math.min(iw,ih)/2-24;let a0=0;const cols=['var(--blue)','var(--orange)','var(--green)','var(--violet)','var(--red)','var(--muted)'];
    o.values.forEach((v,i)=>{const a1=a0+v/tot*2*Math.PI;const p=(a)=>[cx+R*Math.cos(a),cy-R*Math.sin(a)];const [x0,y0]=p(a0),[x1,y1]=p(a1);const big=a1-a0>Math.PI?1:0;
      s+=v>=tot?`<circle cx="${cx}" cy="${cy}" r="${R}" style="fill:${cols[i%6]}"/>`:`<path d="M${cx},${cy} L${x0},${y0} A${R},${R} 0 ${big},0 ${x1},${y1} Z" style="fill:${cols[i%6]};stroke:var(--panel);stroke-width:2"/>`;
      const am=(a0+a1)/2;s+=`<text x="${cx+(R+18)*Math.cos(am)}" y="${cy-(R+18)*Math.sin(am)+4}" text-anchor="${Math.cos(am)>0.1?'start':Math.cos(am)<-0.1?'end':'middle'}" class="axl">${esc(o.labels[i])}</text>`;
      if(o.showVals)s+=`<text x="${cx+R*.6*Math.cos(am)}" y="${cy-R*.6*Math.sin(am)+4}" text-anchor="middle" style="fill:var(--panel);font-weight:700">${(v/tot*100).toFixed(1)}%</text>`;a0=a1;});
    return s+'</svg>';
  }
  let xs,ys,xt,yt,xmap,ymap,cat=false;
  if(o.type==='scatter'){xt=niceTicks(Math.min(...o.xs),Math.max(...o.xs));yt=niceTicks(Math.min(...o.ys),Math.max(...o.ys));}
  else if(o.type==='hist'){const lo=Math.min(...o.values),hi=Math.max(...o.values);const w=(hi-lo)/o.bins;const counts=Array(o.bins).fill(0);o.values.forEach(v=>{let k=Math.floor((v-lo)/w);if(k>=o.bins)k=o.bins-1;counts[k]++;});o.edges=seq(0,o.bins+1).map(k=>lo+k*w);o.counts=counts;xt=niceTicks(lo,hi);xt=xt.filter(t=>t>=lo-1e-9&&t<=hi+1e-9);if(xt.length<2)xt=[lo,hi];yt=niceTicks(0,Math.max(...counts));o.xmin=lo;o.xmax=hi;}
  else{cat=true;const lo=o.type==='plot'?Math.min(...o.values):0;yt=niceTicks(Math.min(0,lo>0&&o.type==='plot'?lo-2:lo),Math.max(...o.values));if(o.type==='plot'&&lo>0)yt=niceTicks(lo-2,Math.max(...o.values));}
  const horiz=o.type==='barh';
  if(horiz){xt=yt;yt=null;}
  const vmin=(horiz?xt:yt||xt)[0],vmax=(horiz?xt:yt||xt).at(-1);
  if(o.type==='scatter'){xmap=x=>m.l+(x-xt[0])/(xt.at(-1)-xt[0])*iw;ymap=y=>m.t+ih-(y-yt[0])/(yt.at(-1)-yt[0])*ih;}
  else if(o.type==='hist'){xmap=x=>m.l+(x-o.xmin)/(o.xmax-o.xmin)*iw;ymap=y=>m.t+ih-(y-yt[0])/(yt.at(-1)-yt[0])*ih;}
  else if(horiz){xmap=v=>m.l+(v-xt[0])/(xt.at(-1)-xt[0])*iw;}
  else ymap=y=>m.t+ih-(y-yt[0])/(yt.at(-1)-yt[0])*ih;
  // grid + ticks
  const N=o.labels?o.labels.length:0;const band=(horiz?ih:iw)/Math.max(N,1);
  if(yt)yt.forEach(t=>{const y=ymap(t);if(o.grid)s+=`<line x1="${m.l}" y1="${y}" x2="${m.l+iw}" y2="${y}" class="gridl"/>`;s+=`<text x="${m.l-10}" y="${y+4}" text-anchor="end">${t}</text>`;});
  if(horiz)xt.forEach(t=>{const x=xmap(t);if(o.grid)s+=`<line x1="${x}" y1="${m.t}" x2="${x}" y2="${m.t+ih}" class="gridl"/>`;s+=`<text x="${x}" y="${m.t+ih+20}" text-anchor="middle">${t}</text>`;});
  if(o.type==='scatter'||o.type==='hist')xt.forEach(t=>{const x=xmap(t);if(o.grid)s+=`<line x1="${x}" y1="${m.t}" x2="${x}" y2="${m.t+ih}" class="gridl"/>`;s+=`<text x="${x}" y="${m.t+ih+20}" text-anchor="middle">${+t.toFixed(2)}</text>`;});
  if(cat&&!horiz)o.labels.forEach((l,i)=>{s+=`<text x="${m.l+band*(i+.5)}" y="${m.t+ih+20}" text-anchor="middle">${esc(l)}</text>`;});
  if(horiz)o.labels.forEach((l,i)=>{s+=`<text x="${m.l-10}" y="${m.t+band*(i+.5)+4}" text-anchor="end">${esc(l)}</text>`;});
  // marks
  if(o.type==='bar')o.values.forEach((v,i)=>{const x=m.l+band*i+band*.18,w=band*.64,y=ymap(v),y0=ymap(Math.max(0,yt[0]));s+=`<rect x="${x}" y="${Math.min(y,y0)}" width="${w}" height="${Math.abs(y0-y)}" rx="3" style="fill:${col}"/>`;if(o.showVals)s+=`<text x="${x+w/2}" y="${y-6}" text-anchor="middle" class="val">${v}</text>`;});
  if(horiz)o.values.forEach((v,i)=>{const y=m.t+band*i+band*.18,hh=band*.64,x0=xmap(Math.max(0,xt[0]));s+=`<rect x="${x0}" y="${y}" width="${xmap(v)-x0}" height="${hh}" rx="3" style="fill:${col}"/>`;if(o.showVals)s+=`<text x="${xmap(v)+6}" y="${y+hh/2+4}" class="val">${v}</text>`;});
  if(o.type==='plot'){const pts=o.values.map((v,i)=>[m.l+band*(i+.5),ymap(v)]);s+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" style="fill:none;stroke:${col};stroke-width:3;stroke-linejoin:round"/>`;if(o.marker)pts.forEach(([x,y])=>s+=`<circle cx="${x}" cy="${y}" r="5.5" style="fill:${col}"/>`);if(o.showVals)pts.forEach(([x,y],i)=>s+=`<text x="${x}" y="${y-12}" text-anchor="middle" class="val">${o.values[i]}</text>`);}
  if(o.type==='scatter')o.xs.forEach((x,i)=>{s+=`<circle cx="${xmap(x)}" cy="${ymap(o.ys[i])}" r="7" style="fill:${col};fill-opacity:.85"/>`;});
  if(o.type==='hist')o.counts.forEach((c,k)=>{const x0=xmap(o.edges[k]),x1=xmap(o.edges[k+1]);const y=ymap(c);s+=`<rect x="${x0}" y="${y}" width="${x1-x0}" height="${m.t+ih-y}" style="fill:${col};stroke:var(--panel);stroke-width:1.5"/>`;if(o.showVals&&c)s+=`<text x="${(x0+x1)/2}" y="${y-6}" text-anchor="middle" class="val">${c}</text>`;});
  s+=`<line x1="${m.l}" y1="${m.t+ih}" x2="${m.l+iw}" y2="${m.t+ih}" class="axis"/><line x1="${m.l}" y1="${m.t}" x2="${m.l}" y2="${m.t+ih}" class="axis"/>`;
  if(o.xlabel)s+=`<text x="${m.l+iw/2}" y="${H-12}" text-anchor="middle" class="axl">${esc(o.xlabel)}</text>`;
  if(o.ylabel)s+=`<text transform="translate(18 ${m.t+ih/2}) rotate(-90)" text-anchor="middle" class="axl">${esc(o.ylabel)}</text>`;
  return s+'</svg>';
}

topic('plt','plt-types','Chart types',
'Matplotlib turns numbers into charts. Pick a chart type, edit the numbers, and the code updates with it.',
'Pick the chart that fits the question: <b>line</b> for change over time, <b>bar</b> to compare, <b>scatter</b> for a link between two values, <b>pie</b> for parts of a whole, <b>hist</b> for how values are spread. Full Matplotlib lessons will be added after the live session.',
ctx=>{
  const D={
    bar:{labels:['Asha','Ravi','Meera','Kabir','Zoya','Dev'],vals:'88, 72, 95, 64, 81, 58',title:'Maths marks',xl:'Student',yl:'Marks',xv:'names',yv:'marks'},
    barh:{labels:['Cricket','Football','Badminton','Chess','Kabaddi'],vals:'14, 9, 7, 5, 3',title:'Favourite sport (class vote)',xl:'Votes',yl:'',xv:'sports',yv:'votes'},
    plot:{labels:['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],vals:'31, 33, 34, 32, 35, 36, 33',title:'Temperature this week',xl:'Day',yl:'°C',xv:'days',yv:'temps'},
    scatter:{xs:[140,145,150,152,155,158,160,163,165,170],ys:[4,5,5,6,6,7,7,8,8,9],title:'Height vs shoe size',xl:'Height (cm)',yl:'Shoe size'},
    pie:{labels:['Snacks','Books','Games','Savings'],vals:'30, 25, 20, 25',title:'How pocket money is spent'},
    hist:{values:[45,52,58,61,63,66,68,70,72,73,75,77,78,80,82,85,88,90,93,97],title:'Marks of 20 students',xl:'Marks',yl:'Number of students'}};
  let type='bar',color='tab:blue',grid=true,showVals=true,bins=5,title=D.bar.title,vals=D.bar.vals,marker=true;
  const sub=h('div',{class:'ctl-sub'});
  const controls=()=>{sub.replaceChildren(Text('title',title,v=>{title=v;draw();},{wide:true}));
    if(['bar','barh','plot','pie'].includes(type))sub.append(Text(`values (${D[type].labels.length} numbers)`,vals,v=>{vals=v;draw();},{wide:true}));
    if(type==='hist')sub.append(Range('bins',3,10,bins,v=>{bins=v;draw();}));
    if(type!=='pie')sub.append(Select('color',Object.keys(PCOL),color,v=>{color=v;draw();}),Check('grid',grid,v=>{grid=v;draw();}));
    if(type==='plot')sub.append(Check('markers',marker,v=>{marker=v;draw();}));
    sub.append(Check(type==='pie'?'show percentages':'show values',showVals,v=>{showVals=v;draw();}));};
  const draw=()=>{
    const d=D[type];let code='import matplotlib.pyplot as plt\n',o={type,title,color,grid,showVals,marker,xlabel:d.xl,ylabel:d.yl};
    if(['bar','barh','plot','pie'].includes(type)){const p=parseNums(vals);if(p.error||p.nums.length!==d.labels.length){const e=p.error||`Type exactly ${d.labels.length} numbers, one for each label.`;ctx.stage.replaceChildren(errbox(e));ctx.out(e,'err');return;}
      if(p.nums.some(v=>v<0)&&type==='pie'){ctx.stage.replaceChildren(errbox('ValueError: Wedge sizes must be non negative'));ctx.out('ValueError: Wedge sizes must be non negative','err');return;}
      o.labels=d.labels;o.values=p.nums;
      const xv=type==='pie'?'labels':d.xv,yv=type==='pie'?'amounts':d.yv;
      code+=`${xv} = ${pyVal(d.labels).replace(/'/g,'"')}\n${yv} = [${p.nums.join(', ')}]\n`;
      if(type==='pie')code+=`plt.pie(${yv}, labels=${xv}${showVals?', autopct="%1.1f%%"':''})\n`;
      else code+=`plt.${type}(${xv}, ${yv}${type==='plot'&&marker?', marker="o"':''}, color="${color}")\n`;}
    else if(type==='scatter'){o.xs=d.xs;o.ys=d.ys;code+=`heights = ${pyVal(d.xs)}\nshoes = ${pyVal(d.ys)}\nplt.scatter(heights, shoes, color="${color}")\n`;}
    else{o.values=d.values;o.bins=bins;code+=`marks = ${pyVal(d.values)}\nplt.hist(marks, bins=${bins}, color="${color}", edgecolor="white")\n`;}
    if(title)code+=`plt.title(${pyStr(title).replace(/^'|'$/g,'"')})\n`;
    if(type!=='pie'){if(d.xl)code+=`plt.xlabel("${d.xl}")\n`;if(d.yl)code+=`plt.ylabel("${d.yl}")\n`;if(grid)code+='plt.grid(True)\n';}
    code+='plt.show()';
    ctx.stage.replaceChildren(h('div',{html:chartSVG(o)}),h('p',{class:'note'},'Example data, made up for practice.'));
    ctx.code(code);ctx.out('A window opens showing the chart.\n(Close it to let the program finish.)','muted');
  };
  ctx.add(Select('chart',[['bar','bar'],['barh','barh (horizontal bar)'],['plot','plot (line)'],['scatter','scatter'],['pie','pie'],['hist','hist (histogram)']],type,v=>{type=v;title=D[v].title;vals=D[v].vals||'';controls();draw();}),sub);controls();draw();
});

topic('plt','plt-anatomy','Parts of a chart',
'Every Matplotlib chart is built from the same parts. Pick a part to light it up and see which line of code controls it.',
'<b>fig</b> is the whole picture. <b>ax</b> is one chart inside it. Most styling calls start with ax.',
ctx=>{
  let part='title';
  const code='import matplotlib.pyplot as plt\ntests = ["T1", "T2", "T3", "T4", "T5"]\na = [72, 78, 75, 83, 88]\nb = [65, 70, 74, 72, 80]\nfig, ax = plt.subplots()\nax.plot(tests, a, marker="o", label="9A")\nax.plot(tests, b, marker="o", label="9B")\nax.set_title("Class average by test")\nax.set_xlabel("Test")\nax.set_ylabel("Average marks")\nax.legend()\nax.grid(True)\nplt.show()';
  const P={figure:{lines:[4],say:'The Figure is the whole window or image. One figure can hold several charts.'},axes:{lines:[4],say:'The Axes is one chart: the box where data is drawn, with its own x and y axes.'},
    title:{lines:[7],say:'The title sits above the axes.'},xlabel:{lines:[8],say:'The x label names what runs along the bottom.'},ylabel:{lines:[9],say:'The y label names what runs up the side.'},
    ticks:{lines:[1,2,3],say:'Ticks are the small marks and numbers on each axis. Matplotlib picks them from your data.'},line:{lines:[5,6],say:'Each ax.plot() call draws one line.'},
    markers:{lines:[5,6],say:'marker="o" puts a dot on every data point.'},legend:{lines:[10],say:'The legend matches each line to its label="…" name.'},grid:{lines:[11],say:'Grid lines help the eye read values across.'}};
  const T=['T1','T2','T3','T4','T5'],A=[72,78,75,83,88],B=[65,70,74,72,80];
  const draw=()=>{
    const W=640,H=420,m={l:70,r:30,t:56,b:62},iw=W-m.l-m.r,ih=H-m.t-m.b;const y=v=>m.t+ih-(v-60)/(90-60)*ih;const x=i=>m.l+iw*(i+.5)/5;
    const g=k=>part===k?' glow':'';
    let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Line chart of class averages with ${part} highlighted"><rect x="2" y="2" width="${W-4}" height="${H-4}" rx="12" class="fig${g('figure')}" style="stroke:var(--line);stroke-width:2"/>`;
    s+=`<rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" class="axes${g('axes')}" style="fill:none;stroke:transparent;stroke-width:2"/>`;
    [60,65,70,75,80,85,90].forEach(t=>{s+=`<line x1="${m.l}" y1="${y(t)}" x2="${m.l+iw}" y2="${y(t)}" class="gridl${g('grid')}"/><text x="${m.l-10}" y="${y(t)+4}" text-anchor="end" class="${g('ticks')}">${t}</text>`;});
    T.forEach((t,i)=>{s+=`<line x1="${x(i)}" y1="${m.t}" x2="${x(i)}" y2="${m.t+ih}" class="gridl${g('grid')}"/><text x="${x(i)}" y="${m.t+ih+20}" text-anchor="middle" class="${g('ticks')}">${t}</text>`;});
    s+=`<line x1="${m.l}" y1="${m.t+ih}" x2="${m.l+iw}" y2="${m.t+ih}" class="axis"/><line x1="${m.l}" y1="${m.t}" x2="${m.l}" y2="${m.t+ih}" class="axis"/>`;
    [[A,'var(--blue)'],[B,'var(--orange)']].forEach(([D,c])=>{s+=`<polyline points="${D.map((v,i)=>x(i)+','+y(v)).join(' ')}" class="${g('line').trim()}" style="fill:none;stroke:${c};stroke-width:3"/>`;D.forEach((v,i)=>s+=`<circle cx="${x(i)}" cy="${y(v)}" r="${part==='markers'?8:5}" style="fill:${c};${part==='markers'?'stroke:var(--orange);stroke-width:3':''}"/>`);});
    s+=`<g><rect x="${m.l+14}" y="${m.t+12}" width="84" height="56" rx="6" class="${g('legend').trim()}" style="fill:var(--panel);stroke:var(--line)"/><line x1="${m.l+24}" y1="${m.t+31}" x2="${m.l+46}" y2="${m.t+31}" style="stroke:var(--blue);stroke-width:3"/><text x="${m.l+54}" y="${m.t+35}" class="${g('legend')}">9A</text><line x1="${m.l+24}" y1="${m.t+53}" x2="${m.l+46}" y2="${m.t+53}" style="stroke:var(--orange);stroke-width:3"/><text x="${m.l+54}" y="${m.t+57}" class="${g('legend')}">9B</text></g>`;
    s+=`<text x="${m.l+iw/2}" y="34" text-anchor="middle" class="ttl${g('title')}">Class average by test</text><text x="${m.l+iw/2}" y="${H-16}" text-anchor="middle" class="axl${g('xlabel')}">Test</text><text transform="translate(22 ${m.t+ih/2}) rotate(-90)" text-anchor="middle" class="axl${g('ylabel')}">Average marks</text></svg>`;
    ctx.stage.replaceChildren(h('div',{html:s}),h('div',{class:'tile',style:'font-size:1.02rem;font-family:var(--body)'},P[part].say));
    ctx.code(code,P[part].lines);ctx.out(`Part: ${part}\nControlled by line ${P[part].lines.map(l=>l+1).join(' and ')} of the code.`);
  };
  ctx.add(Select('part',Object.keys(P),part,v=>{part=v;draw();}),Btns(...Object.keys(P).map(k=>Btn(k,()=>{part=k;ctx.controls.querySelector('select').value=k;draw();},'mono'))));draw();
});
/* =================== WIRING =================== */
(function(){
  const modSel=$('#modSel'),topSel=$('#topSel'),stage=$('#stage'),controls=$('#controls'),codeEl=$('#code'),outEl=$('#out');
  let cur=null,timers=[];
  MODULES.forEach(m=>modSel.append(h('option',{value:m.id},`${m.name} (${TOPICS.filter(t=>t.mod===m.id).length})`)));
  const fillTopics=mod=>{topSel.replaceChildren(...TOPICS.filter(t=>t.mod===mod).map((t,i)=>h('option',{value:t.id},`${i+1}. ${t.title}`)));};
  function show(id){
    const t=TOPICS.find(x=>x.id===id)||TOPICS[0];
    timers.forEach(x=>{clearInterval(x);clearTimeout(x);});timers=[];
    cur=t;
    if(modSel.value!==t.mod){modSel.value=t.mod;fillTopics(t.mod);}
    topSel.value=t.id;
    const inMod=TOPICS.filter(x=>x.mod===t.mod);const mod=MODULES.find(m=>m.id===t.mod);
    $('#eyebrow').textContent=`${mod.name} · ${inMod.indexOf(t)+1} of ${inMod.length}`;
    $('#topicTitle').textContent=t.title;$('#blurb').textContent=t.blurb;$('#tip').innerHTML=t.tip?'<b>Teacher tip.</b> '+t.tip:'';
    const gi=TOPICS.indexOf(t);$('#pos').textContent=`${gi+1} / ${TOPICS.length}`;
    $('#prevBtn').disabled=gi===0;$('#nextBtn').disabled=gi===TOPICS.length-1;
    stage.replaceChildren();controls.replaceChildren();codeEl.innerHTML='';outEl.className='out';outEl.replaceChildren();
    const ctx={stage,controls,add:(...els)=>controls.append(...els),
      code:(src,active)=>{codeEl.innerHTML=codeHTML(src,i=>(Array.isArray(active)?active.includes(i):active===i)?'on':'');},
      out:(v,kind)=>{outEl.className='out'+(kind?' '+kind:'');outEl.replaceChildren(typeof v==='string'?document.createTextNode(v):v);},
      every:(ms,fn)=>{const id=setInterval(fn,ms);timers.push(id);return id;},
      after:(ms,fn)=>{const id=setTimeout(fn,ms);timers.push(id);return id;}};
    try{t.build(ctx);}catch(e){console.error(e);ctx.out('This visual hit a problem: '+e.message,'err');}
    try{history.replaceState(null,'','#'+t.id);}catch(e){}
    try{localStorage.setItem('pyLabTopic',t.id);}catch(e){}
  }
  modSel.addEventListener('change',()=>{fillTopics(modSel.value);show(TOPICS.find(t=>t.mod===modSel.value).id);});
  topSel.addEventListener('change',()=>show(topSel.value));
  const step=d=>{const i=TOPICS.indexOf(cur)+d;if(i>=0&&i<TOPICS.length)show(TOPICS[i].id);};
  $('#prevBtn').addEventListener('click',()=>step(-1));$('#nextBtn').addEventListener('click',()=>step(1));
  document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea,select'))return;if(e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1);});
  window.addEventListener('hashchange',()=>{const id=(location.hash||'').slice(1);if(cur&&id!==cur.id&&TOPICS.some(t=>t.id===id))show(id);});
  let start=(location.hash||'').slice(1);
  if(!TOPICS.some(t=>t.id===start)){try{start=localStorage.getItem('pyLabTopic')||'';}catch(e){start='';}}
  if(!TOPICS.some(t=>t.id===start))start=TOPICS[0].id;
  modSel.value=TOPICS.find(t=>t.id===start).mod;fillTopics(modSel.value);show(start);
})();

</script>
