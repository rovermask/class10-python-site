<style>
.groups{display:flex;flex-direction:column;gap:16px}
.group h3{font:700 .74rem var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:10px}
.unit{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--panel);cursor:pointer}
.unit:hover{border-color:var(--blue)}
.unit[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft)}
.unit b{font:600 1.1rem var(--display)}
.unit span{font:600 .82rem var(--mono);color:var(--muted)}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:.55rem 1rem;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font:700 .74rem var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field input[type=text]{border:2px solid var(--line);border-radius:10px;background:var(--panel);padding:.55rem .75rem;width:min(20rem,100%)}
.check{display:flex;gap:8px;align-items:center;font-weight:600}
.check input{width:18px;height:18px;accent-color:var(--blue)}
.top{display:flex;flex-direction:column;gap:10px}
.rail{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.rail i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .3s}
.map{display:flex;flex-wrap:wrap;gap:6px}
.map button{width:34px;height:34px;border-radius:9px;border:2px solid var(--line);background:var(--panel);font:600 .8rem var(--mono);cursor:pointer;color:var(--muted);font-variant-numeric:tabular-nums}
.map button.done{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.map button.ok{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.map button.no{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.map button.cur{outline:3px solid var(--orange);outline-offset:1px}
.qhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline}
.qnum{font:700 .85rem var(--mono);color:var(--muted)}
.tag{font:700 .72rem var(--mono);text-transform:uppercase;letter-spacing:.06em;padding:3px 9px;border-radius:99px;background:var(--orange-soft);color:var(--orange)}
.qtext{font-size:1.15rem;font-weight:600;max-width:65ch}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--panel);cursor:pointer;width:100%;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt:disabled{cursor:default}
.opt .k{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:700 .9rem var(--mono);background:var(--sunk);color:var(--muted)}
.opt .t{flex:1;min-width:0;padding-top:3px;overflow-wrap:anywhere}
.opt .t.mono{font:500 .98rem/1.5 var(--mono);white-space:pre-wrap}
.opt .s{flex:none;font:700 .8rem var(--body);padding-top:6px}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.sel .k{background:var(--blue);color:var(--panel)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:var(--panel)}
.opt.right .s{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--panel)}
.opt.wrong .s{color:var(--bad)}
.ex{border-radius:12px;padding:12px 14px;background:var(--sunk);font-size:.98rem}
.ex b{display:block;margin-bottom:2px}
.ex.ok b{color:var(--good)}.ex.no b{color:var(--bad)}
.warn{background:var(--orange-soft);border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.keys{font-size:.85rem}
kbd{font:600 .8rem var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--panel)}
.score{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end}
.big{font:600 clamp(3rem,10vw,4.5rem)/1 var(--display);font-variant-numeric:tabular-nums}
.big small{font-size:.4em;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,11rem) 1fr auto;gap:12px;align-items:center}
.bar .track{height:12px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--blue);border-radius:99px}
.bar .n{font:700 .9rem var(--mono);font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column;gap:14px}
.ritem{border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--panel);min-width:0}
.ritem.ok{border-left:4px solid var(--good)}.ritem.no{border-left:4px solid var(--bad)}
.ans{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.95rem}
.pill{font:700 .75rem var(--body);padding:2px 9px;border-radius:99px}
.pill.ok{background:var(--good-soft);color:var(--good)}.pill.no{background:var(--bad-soft);color:var(--bad)}
@media (max-width:520px){.opt{flex-wrap:wrap}.opt .s{flex-basis:100%;padding:0 0 0 44px}.bar{grid-template-columns:1fr auto}.bar .track{grid-column:1/-1;order:3}.qtext{font-size:1.05rem}}
</style>
</head>

function shuffled(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
